# The final video (Hiten 2026-11-16: "one final video that shows everything nicely and
# beautifully and cinematically"; no cuts, no fades, time never skips). One camera path:
# a wide opening view of the hole and the far cloud (like the web demo), a slow push in as the
# cloud stretches into a stream, a slow arc round the hole a little above the orbital plane
# (the x-y plane) while the stream whips round behind it (lensed arcs over and under the
# shadow, the Interstellar look), then a pull back as the gas flies out. Draft 1: path only
# (designed with scripts/path_preview.py); sources switch to dense_P188 when it is on the Mac.
name = "full_story"
colour = "true"
# physical absorption (free-free + electron scattering at the gas temperature; phase-09 9.4
# option 1): thin hot gas turns nearly transparent, which clears the fog round the ring
opacity = "thermal"
# Draft 1 (2026-11-17): the approved continuous shot (0-50 s) continued into the ring
# (DECISIONS 2026-11-17): B the long wait (50-60 s), C the crash (60-78 s), D the ring
# (78-98 s), then a slow pull back and around to 108 s, fading to black.
fps = 24
duration = 108.0
fade_out = 6.0  # the ending fades to black over the last 6 s (Hiten 2026-11-17)
width = 640
height = 360
n_sub = 1
kappa = 1e7

# Pinpoint stars (Hiten 2026-11-19: "each background star pinpoint, no giant circles, no
# blobs, no blurriness"): every star a point through the lens map (render/point_stars.py); the
# cube keeps the Milky Way band only, at the approved exposure (low-res render's star exposure).
# Hiten 2026-11-19: size 3 of outputs/checks/stars_size_options.png (stars with a small size:
# pinpoint in open sky, lensed into arcs near the hole; clip outputs/checks/stars_s3.mp4), with
# ~17% fewer stars than its 300,000 ("less cluttered").
[stars]
mode = "points"
n_stars = 250000
size_deg = 0.016
gamma = 0.4
brightness = 10.0
band_exposure = 1.0757394861345457e-04

# rays must reach the far cloud (r 5,000) and start inside the grid (camera <= 0.9 r_max)
[grid]
r_max = 8000.0
nr = 230

# sparse fine grid for all compact gas, from the far cloud (r 5,000) to the thin stream
# (render/bricks.py; replaces the trailer's growing detail box)
[bricks]
r_fine = 8000.0
# after the pass the spread-out gas (h 4-16) cost ~90,000 bricks and 1-6 min per frame at
# 1-unit cells; from day 105 the cells are 2 units and the support limit 2 bricks (the same
# 32 units, so the same particles as before): 8x fewer bricks, 16-25 s per frame, within
# 0.12 of 255 of the 1-unit frame (outputs/checks/ring_t86_slow_lc4_fast.png). An earlier
# rule (1 brick at 1-unit cells) sent the wide far gas to the coarse log grid: a soft blob
# popped in at 50.4 s (AI_LOG 2026-11-18). Unchanged through the approved first 50 s.
dx_by_day = [[0.0, 1.0], [105.0, 2.0]]
max_support_by_day = [[0.0, 4.0], [105.0, 2.0]]

# One consistent run through the pass: the original run to its dump 188 (day 94.385, where the
# gas is still > 280 from the hole and half-day dumps are fine), then dense_P188 (restarted
# exactly from that dump, dumps every 64). After day 99.65 (gas > 300 from the hole) the older
# dense_C400 for now (a different run: a small jump there) until dense_P188 part 2 is done.
# the gas brightens by orders of magnitude from the cool cloud to the hot pass: a smooth
# automatic exposure (an eye adapting over ~2 s), compensating 90% so the pass still blazes.
# 4 s / 75% let the cloud fade 2.3 stops in its first 3 s (its outer skin cools from 9,700 K
# to 6,000 K by day 45 and is all the camera sees at kappa 1e7; first low-res render)
# readings every 0.5 s, smoothed over 0.5 s (was 1 s / 2 s): the gas brightens ~80x in 1.5 s
# as the stream head whips round the hole (16-17.5 s); the old setting darkened the gas 1.3
# stops too early, then flared 2.3 stops (outputs/checks/flare_exposure_options.png)
[auto_exposure]
every = 0.5
smooth = 0.5
strength = 0.9

[[sources]]
run = "R6.1_100k_ph_approach"
to_day = 94.385

[[sources]]
run = "dense_P188a"
from_day = 94.385
to_day = 99.65

# a different run from dense_P188a: its gas sits up to ~tens of units away at the join, so
# the jump is eased in over 0.25 day (~1 s of video here; render.junctions)
[[sources]]
run = "dense_C400"
from_day = 99.65
to_day = 103.9245
ease_days = 0.25

# the main run (beta 230) after the pass: the gas flies out to r ~5,000 and falls back
[[sources]]
run = "R6.1_100k_ph_b_to235"
from_day = 103.9244  # its first dump (day 103.92447) replaces dense_C400's at the same time
to_day = 235.96379
ease_days = 0.8  # eased while the video is still slow (~49-50 s), before time speeds up

# the fast-cooling case (beta 1), restarted from the main run's dump 470 (day 235.96): its
# first dump continues that state, so this join needs no easing
[[sources]]
run = "R6.6_cool_part1"
from_day = 235.97

# the same run, converted after it stopped (dump 630, day 316.3; DECISIONS 2026-11-17)
[[sources]]
run = "R6.6_cool_part2"
from_day = 300.75

